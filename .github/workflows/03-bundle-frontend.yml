name: Bundle Frontend into Backend

on:
  workflow_dispatch:

jobs:
  bundle-frontend:
    runs-on: ubuntu-latest

    steps:
      # Checkout Frontend Repository
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: curecloudtechnology/ClaimSync_Frontend
          token: ${{ secrets.GH_PAT }}
          path: frontend

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install Dependencies
      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      # Build Frontend
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # Checkout Backend Repository
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: curecloudtechnology/ClaimSync_Backend
          token: ${{ secrets.GH_PAT }}
          path: backend

      # Remove old frontend files
      - name: Clean Static Folder
        run: |
          rm -rf backend/src/main/resources/static/*
          mkdir -p backend/src/main/resources/static

      # Copy new frontend build
      - name: Copy Frontend Build
        run: |
          cp -R frontend/dist/* backend/src/main/resources/static/

      # Verify copied files
      - name: Verify Bundle
        run: |
          echo "===== Static Folder ====="
          ls -la backend/src/main/resources/static