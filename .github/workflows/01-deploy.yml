name: ClaimSync Deployment

on:
  workflow_dispatch:

concurrency:
  group: claimsync-deployment
  cancel-in-progress: false

jobs:
  deployment:
    name: ClaimSync Deployment
    runs-on: self-hosted

    steps:

      - name: Runner Information
        shell: cmd
        run: |
          hostname
          echo %COMPUTERNAME%
          echo %USERNAME%

      - name: Verify Deployment Workflow
        shell: cmd
        run: |
          echo Running on self-hosted runner.

      - name: Update Frontend Repository
        shell: powershell
        run: |
          Write-Host "Updating Frontend..."
          Set-Location "D:\DevOps\Repositories\ClaimSync_Frontend"
          git checkout dev
          git pull origin dev

      - name: Update Backend Repository
        shell: powershell
        run: |
          Write-Host "Updating Backend..."
          Set-Location "D:\DevOps\Repositories\ClaimSync_Backend"
          git checkout dev
          git pull origin dev

      - name: Verify Build Environment
        shell: powershell
        run: |
          Write-Host "========== Environment =========="
          git --version
          node --version
          npm --version
          java -version
          mvn -version

      - name: Build Frontend
        shell: powershell
        run: |
          Write-Host "========== Building Frontend =========="
          Set-Location "D:\DevOps\Repositories\ClaimSync_Frontend"

          npm ci
          npm run build

          if (!(Test-Path ".\dist")) {
              throw "Frontend build failed. dist folder not found."
          }

          Write-Host "Frontend build completed successfully."