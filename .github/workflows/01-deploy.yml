name: ClaimSync Deployment

on:
  workflow_dispatch:

concurrency:
  group: claimsync-deployment
  cancel-in-progress: false

jobs:
  deployment:
    name: ClaimSync Deployment
    runs-on: self-hosted

    steps:

      #########################################################
      # Runner Information
      #########################################################

      - name: Runner Information
        shell: cmd
        run: |
          hostname
          echo %COMPUTERNAME%
          echo %USERNAME%

      #########################################################
      # Verify Workflow
      #########################################################

      - name: Verify Deployment Workflow
        shell: cmd
        run: |
          echo Running on self-hosted runner.

      #########################################################
      # Update Frontend
      #########################################################

      - name: Update Frontend Repository
        shell: powershell
        run: |
          Set-Location "D:\DevOps\Repositories\ClaimSync_Frontend"

          git checkout dev
          git pull origin dev

      #########################################################
      # Update Backend
      #########################################################

      - name: Update Backend Repository
        shell: powershell
        run: |
          Set-Location "D:\DevOps\Repositories\ClaimSync_Backend"

          git checkout dev
          git pull origin dev

      #########################################################
      # Environment Check
      #########################################################

      - name: Verify Build Environment
        shell: powershell
        run: |

          Write-Host "========== Environment =========="

          git --version
          node --version
          npm --version
          java -version
          mvn -version

      #########################################################
      # Build Frontend
      #########################################################

      - name: Build Frontend
        shell: powershell
        run: |

          Write-Host "========== Building Frontend =========="

          Set-Location "D:\DevOps\Repositories\ClaimSync_Frontend"

          npm ci

          npm run build

          if (!(Test-Path ".\dist"))
          {
              throw "Frontend build failed."
          }

          Write-Host "Frontend build completed successfully."

      #########################################################
      # Bundle Frontend
      #########################################################

      - name: Bundle Frontend into Backend
        shell: powershell
        run: |

          $frontendDist="D:\DevOps\Repositories\ClaimSync_Frontend\dist"

          $backendStatic="D:\DevOps\Repositories\ClaimSync_Backend\src\main\resources\static"

          if(Test-Path $backendStatic)
          {
              Remove-Item "$backendStatic\*" -Recurse -Force
          }

          Copy-Item "$frontendDist\*" $backendStatic -Recurse -Force

          if(!(Test-Path "$backendStatic\index.html"))
          {
              throw "Bundle failed."
          }

          Write-Host "Frontend bundled successfully."

      #########################################################
      # Build Backend
      #########################################################

      - name: Build Backend
        shell: powershell
        run: |

          Write-Host "========== Building Backend =========="

          Set-Location "D:\DevOps\Repositories\ClaimSync_Backend"

          mvn clean package

          $jar = Get-ChildItem ".\target\*.jar" |
                 Where-Object { $_.Name -notmatch "original" } |
                 Select-Object -First 1

          if($null -eq $jar)
          {
              throw "Backend JAR not generated."
          }

          Write-Host "Generated:"
          Write-Host $jar.FullName

      #########################################################
      # Publish Build Artifact
      #########################################################

      - name: Publish Build Artifact
        shell: powershell
        run: |

          $jar = Get-ChildItem "D:\DevOps\Repositories\ClaimSync_Backend\target\*.jar" |
                 Where-Object { $_.Name -notmatch "original" } |
                 Select-Object -First 1

          if($null -eq $jar)
          {
              throw "Artifact not found."
          }

          $output="D:\DevOps\Output"

          if(!(Test-Path $output))
          {
              New-Item -ItemType Directory -Path $output | Out-Null
          }

          Copy-Item $jar.FullName "$output\ClaimSync.jar" -Force

          if(!(Test-Path "$output\ClaimSync.jar"))
          {
              throw "Publishing failed."
          }

          Write-Host ""
          Write-Host "Artifact published."

      #########################################################
      # Backup Build Artifact
      #########################################################

      - name: Backup Build Artifact
        shell: powershell
        run: |

          Write-Host "========== Backup =========="

          $artifact="D:\DevOps\Output\ClaimSync.jar"

          if(!(Test-Path $artifact))
          {
              throw "ClaimSync.jar not found."
          }

          $timestamp=Get-Date -Format "yyyyMMdd_HHmmss"

          $backupFolder="D:\DevOps\Backups\$timestamp"

          New-Item `
            -ItemType Directory `
            -Path $backupFolder `
            -Force | Out-Null

          Copy-Item `
            $artifact `
            "$backupFolder\ClaimSync.jar" `
            -Force

          if(!(Test-Path "$backupFolder\ClaimSync.jar"))
          {
              throw "Backup failed."
          }

          Write-Host ""
          Write-Host "Backup created."

          Write-Host "$backupFolder\ClaimSync.jar"
      
      #########################################################
      # Verify Deploy Folder
      #########################################################

      - name: Verify Deploy Folder
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========== Verify Deploy Folder =========="

          $deployFolder = "D:\DevOps\Deploy"

          if (!(Test-Path $deployFolder))
          {
              throw "Deploy folder does not exist."
          }

          $deployJar = "$deployFolder\ClaimSync.jar"

          if (!(Test-Path $deployJar))
          {
              Write-Warning "No deployed JAR found."

              Write-Host "This is acceptable for the first deployment."

              exit 0
          }

          Write-Host ""
          Write-Host "Current deployment found."

          Get-Item $deployJar | Format-List Name,Length,LastWriteTime
      

            #########################################################
      # Gracefully Shutdown Running Application
      #########################################################

      - name: Gracefully Shutdown Running Application
        shell: powershell
        continue-on-error: true
        run: |

          Write-Host ""
          Write-Host "========== Graceful Shutdown =========="

          try
          {
              $response = Invoke-RestMethod `
                  -Method POST `
                  -ContentType "application/json" `
                  -Body "{}" `
                  -Uri "http://localhost:8080/actuator/shutdown"

              Write-Host ""
              Write-Host "Shutdown request accepted."

              if ($response.message)
              {
                  Write-Host $response.message
              }
          }
          catch
          {
              Write-Warning "Application is not running or shutdown endpoint is unavailable."
              Write-Host $_.Exception.Message
          }

      #########################################################
      # Wait Until Application Stops
      #########################################################

      - name: Wait Until Application Stops
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========== Waiting for Application =========="

          $timeout = 60
          $elapsed = 0

          while ($elapsed -lt $timeout)
          {
              $connection = Get-NetTCPConnection `
                  -LocalPort 8080 `
                  -State Listen `
                  -ErrorAction SilentlyContinue

              if ($null -eq $connection)
              {
                  Write-Host ""
                  Write-Host "Application stopped successfully."

                  exit 0
              }

              Write-Host "Waiting... ($elapsed seconds)"

              Start-Sleep -Seconds 2

              $elapsed += 2
          }

          throw "Application did not stop within 60 seconds."

      #########################################################
      # Deploy New Application
      #########################################################

      - name: Deploy New Application
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========== Deploy New Application =========="

          $sourceJar = "D:\DevOps\Output\ClaimSync.jar"
          $deployJar = "D:\DevOps\Deploy\ClaimSync.jar"

          if (!(Test-Path $sourceJar))
          {
              throw "Build artifact not found."
          }

          Copy-Item `
              $sourceJar `
              $deployJar `
              -Force

          if (!(Test-Path $deployJar))
          {
              throw "Deployment failed."
          }

          Write-Host ""
          Write-Host "Deployment completed successfully."

          Get-Item $deployJar | Format-List Name,Length,LastWriteTime

      #########################################################
      # Start Application
      #########################################################

      - name: Start Application
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========== Starting Application =========="

          $deployFolder = "D:\DevOps\Deploy"
          $deployJar = "$deployFolder\ClaimSync.jar"

          if (!(Test-Path $deployJar))
          {
              throw "Deployment JAR not found."
          }

          Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar `"$deployJar`"" `
              -WorkingDirectory $deployFolder `
              -WindowStyle Hidden

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Application started." 
      
            #########################################################
      # Verify Application Health
      #########################################################

      - name: Verify Application Health
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========== Verifying Application Health =========="

          $timeout = 120
          $elapsed = 0

          while ($elapsed -lt $timeout)
          {
              try
              {
                  $response = Invoke-RestMethod `
                      -Method GET `
                      -Uri "http://localhost:8080/actuator/health"

                  if ($response.status -eq "UP")
                  {
                      Write-Host ""
                      Write-Host "Application is healthy."

                      exit 0
                  }
              }
              catch
              {
                  Write-Host "Waiting for application startup..."
              }

              Start-Sleep -Seconds 5
              $elapsed += 5
          }

          throw "Application failed health check."

      
      