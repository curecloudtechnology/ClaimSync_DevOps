name: ClaimSync Deployment

on:
  workflow_dispatch:

concurrency:
  group: claimsync-deployment
  cancel-in-progress: false

jobs:
  deployment:
    name: ClaimSync Deployment
    runs-on: self-hosted

    steps:

      #########################################################
      # Runner Information
      #########################################################

      - name: Runner Information
        shell: cmd
        run: |
          hostname
          echo %COMPUTERNAME%
          echo %USERNAME%

      #########################################################
      # Verify Workflow
      #########################################################

      - name: Verify Deployment Workflow
        shell: cmd
        run: |
          echo Running on self-hosted runner.

      #########################################################
      # Git Synchronization
      #########################################################

      - name: Update Frontend Repository
        shell: powershell
        run: |
          Write-Host "Updating Frontend..."
          Set-Location "D:\DevOps\Repositories\ClaimSync_Frontend"
          git checkout dev
          git pull origin dev

      - name: Update Backend Repository
        shell: powershell
        run: |
          Write-Host "Updating Backend..."
          Set-Location "D:\DevOps\Repositories\ClaimSync_Backend"
          git checkout dev
          git pull origin dev

      #########################################################
      # Environment Verification
      #########################################################

      - name: Verify Build Environment
        shell: powershell
        run: |
          git --version
          node --version
          npm --version
          java -version
          mvn -version

      #########################################################
      # Frontend Build
      #########################################################

      - name: Build Frontend
        shell: powershell
        run: |
          Set-Location "D:\DevOps\Repositories\ClaimSync_Frontend"

          npm ci
          npm run build

          if (!(Test-Path ".\dist"))
          {
              throw "Frontend build failed."
          }

      #########################################################
      # Bundle Frontend
      #########################################################

      - name: Bundle Frontend into Backend
        shell: powershell
        run: |

          $frontendDist = "D:\DevOps\Repositories\ClaimSync_Frontend\dist"
          $backendStatic = "D:\DevOps\Repositories\ClaimSync_Backend\src\main\resources\static"

          if (Test-Path $backendStatic)
          {
              Remove-Item "$backendStatic\*" -Recurse -Force
          }

          Copy-Item "$frontendDist\*" $backendStatic -Recurse -Force

          if (!(Test-Path "$backendStatic\index.html"))
          {
              throw "Bundle failed."
          }

      #########################################################
      # Backend Build
      #########################################################

      - name: Build Backend
        shell: powershell
        run: |

          Set-Location "D:\DevOps\Repositories\ClaimSync_Backend"

          mvn clean package

          $jar = Get-ChildItem ".\target\*.jar" |
                 Where-Object { $_.Name -notmatch "original" } |
                 Select-Object -First 1

          if ($null -eq $jar)
          {
              throw "JAR not generated."
          }

      #########################################################
      # Publish Build Artifact
      #########################################################

      - name: Publish Build Artifact
        shell: powershell
        run: |

          $jar = Get-ChildItem "D:\DevOps\Repositories\ClaimSync_Backend\target\*.jar" |
                 Where-Object { $_.Name -notmatch "original" } |
                 Select-Object -First 1

          if ($null -eq $jar)
          {
              throw "Build artifact not found."
          }

          $outputFolder = "D:\DevOps\Output"

          if (!(Test-Path $outputFolder))
          {
              New-Item -ItemType Directory -Path $outputFolder | Out-Null
          }

          Copy-Item $jar.FullName "$outputFolder\ClaimSync.jar" -Force

          if (!(Test-Path "$outputFolder\ClaimSync.jar"))
          {
              throw "Artifact publishing failed."
          }

          Write-Host ""
          Write-Host "Published Artifact:"
          Write-Host "$outputFolder\ClaimSync.jar"