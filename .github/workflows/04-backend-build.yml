name: Build Backend

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      # Checkout Frontend
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: curecloudtechnology/ClaimSync_Frontend
          token: ${{ secrets.GH_PAT }}
          path: frontend

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build Frontend
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # Checkout Backend
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: curecloudtechnology/ClaimSync_Backend
          token: ${{ secrets.GH_PAT }}
          path: backend

      # Replace static folder contents
      - name: Clean Static Folder
        run: |
          rm -rf backend/src/main/resources/static/*
          mkdir -p backend/src/main/resources/static

      - name: Copy Frontend Build
        run: |
          cp -R frontend/dist/* backend/src/main/resources/static/

      # Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build Backend
      - name: Build Backend
        working-directory: backend
        run: mvn clean package -DskipTests

      # Verify JAR
      - name: Verify JAR
        run: |
          echo "Generated JAR files:"
          ls -la backend/target